<svg width="1160" height="660" viewBox="0 0 1160 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Token saver preview</title>
  <desc id="desc">A GitHub README preview image showing a floating token activity chart, token saved totals, and supported AI coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1160" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef6ff"/>
      <stop offset="0.5" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eefdf5"/>
    </linearGradient>
    <linearGradient id="panel" x1="190" y1="70" x2="940" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#092018"/>
    </linearGradient>
    <linearGradient id="usage" x1="234" y1="138" x2="234" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="saved" x1="234" y1="160" x2="234" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="150" y="32" width="860" height="584" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1160" height="660" fill="url(#bg)"/>
  <circle cx="1042" cy="120" r="120" fill="#bfdbfe" opacity="0.24"/>
  <circle cx="120" cy="560" r="160" fill="#bbf7d0" opacity="0.28"/>

  <text x="90" y="100" fill="#0f172a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">Token saver</text>
  <text x="92" y="142" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Context-aware token savings for Codex, Claude, Cursor, Aider, and other coding agents.</text>

